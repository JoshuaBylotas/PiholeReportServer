name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # dotnet build does NOT parse appsettings.json, so a malformed one ships
      # happily and then crashes the app at startup behind an opaque HTTP 500.
      # Parse every settings file here instead. JSON has no comment syntax and
      # rejects a bare backslash, so "//key" placeholders are fine but Windows
      # paths in a comment string must use forward slashes or be escaped.
      - name: Validate settings JSON
        run: |
          fail=0
          while IFS= read -r f; do
            if python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8-sig'))" "$f"; then
              echo "ok   $f"
            else
              echo "::error file=$f::Malformed JSON"
              fail=1
            fi
          done < <(find src tests -name 'appsettings*.json' -not -path '*/bin/*' -not -path '*/obj/*')
          exit $fail

      # TreatWarningsAsErrors is on, so this also fails on any NuGet
      # vulnerability advisory (NU1902 / NU1903).
      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: List vulnerable packages
        if: always()
        run: dotnet list package --vulnerable --include-transitive

  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # This repository is public, so the private/ boundary is a real control
      # rather than a convention. Fail if anything but the README and the
      # template is tracked there.
      - name: Assert private/ contains only committed placeholders
        run: |
          tracked=$(git ls-files private/ \
            | grep -v -E '^private/(README\.md|environment\.template\.md)$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Unexpected tracked files under private/:"
            echo "$tracked"
            exit 1
          fi
          echo "private/ boundary intact."

      - name: Assert no credentials committed in appsettings
        run: |
          if grep -rniE '"(ClientSecret|Password)"[[:space:]]*:[[:space:]]*"[^"<]' \
               --include='appsettings*.json' src/; then
            echo "::error::A credential appears to be committed. Use user-secrets or environment variables."
            exit 1
          fi
          echo "No credentials found in appsettings."
